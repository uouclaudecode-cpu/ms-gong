<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MS PICK — My Selection PICK. 내가 고른 공기업의 채용 공고·뉴스·합격 후기를 한눈에" />
    <meta name="theme-color" content="#6d5cff" />
    <meta property="og:title" content="MS PICK · 내가 고른 공기업만 모아보기" />
    <meta property="og:description" content="관심 공기업의 채용 공고 D-Day, 최신 뉴스, 네이버 블로그 합격 후기를 한곳에서" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <title>MS PICK · 내가 고른 공기업만</title>
    <script>
      // 화면이 그려지기 전에 다크 모드를 적용해 깜빡임을 막습니다
      try {
        var t = localStorage.getItem('ms-gong:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
