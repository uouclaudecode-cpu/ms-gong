# 잡알리오 데이터를 미리 불러 `data` 브랜치에 JSON으로 올립니다.
# 사이트의 서버 함수(api/_lib/snapshot.js)가 이 파일을 먼저 읽어서, 방문자는 기다리지 않습니다.
# 필요한 것: 저장소 Settings > Secrets and variables > Actions 에 DATA_GO_KR_KEY
name: snapshot

on:
  schedule:
    - cron: '7 * * * *' # 매시 7분: 진행 중 공고
    - cron: '37 19 * * *' # 매일 04:37(한국 시간): 공고 + 기관 목록 + 기업별 채용 트렌드
  workflow_dispatch: # Actions 탭에서 손으로 실행

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 지난번 파일을 먼저 가져와 둡니다 (이번에 안 만드는 파일이 사라지지 않게)
      - name: 이전 데이터 가져오기
        run: |
          mkdir -p snapshot
          if git fetch --depth=1 origin data; then
            git --work-tree=snapshot checkout origin/data -- .
            git reset -q
          fi

      - name: 데이터 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            node scripts/snapshot.mjs jobs
          else
            node scripts/snapshot.mjs jobs institutions trends
          fi

      # 기록이 쌓이지 않도록 매번 커밋 하나짜리 브랜치로 덮어씁니다
      - name: data 브랜치에 올리기
        if: always()
        working-directory: snapshot
        run: |
          [ -f jobs.json ] || exit 0
          git init -q -b data
          git config user.name "ms-pick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
